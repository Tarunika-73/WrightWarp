services:
  mongodb:
    image: mongo:7
    container_name: wrightwarp-mongodb
    restart: unless-stopped
    # Unauthenticated by default for local development (standard for a local
    # MongoDB instance - unlike PostgreSQL, MongoDB does not require a
    # password to start). Set MONGO_USER/MONGO_PASSWORD in .env AND
    # uncomment the two MONGO_INITDB_ROOT_* lines below to run with auth
    # enabled; the backend already supports it via MONGO_USER/MONGO_PASSWORD
    # (app/core/config.py). See docs/architecture/database.md for a caveat
    # observed in this environment: authenticated connections through
    # Docker Desktop's Windows port-forwarding intermittently failed the
    # SCRAM handshake even from the official `mongosh` CLI on the host,
    # while unauthenticated connections and all in-container auth worked
    # correctly - a host-networking quirk, not an application bug.
    environment:
      # MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      # MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB_NAME:-wrightwarp}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - wrightwarp_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  wrightwarp_mongo_data:
